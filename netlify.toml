[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/lyrics/search"
  to = "/.netlify/functions/lyrics-search"
  status = 200
  force = true

[[redirects]]
  from = "/api/artist-avatar"
  to = "/.netlify/functions/artist-avatar"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
